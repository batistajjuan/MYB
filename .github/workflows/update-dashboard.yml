name: Actualizar Dashboard

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-22.04

    permissions:
      contents: write

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar SQL Server 2022 y sqlcmd
        run: |
          sudo rm -f /etc/apt/sources.list.d/mssql*.list /etc/apt/sources.list.d/microsoft*.list /etc/apt/trusted.gpg.d/microsoft.asc
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
          echo "deb [arch=amd64,arm64,armhf signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/ubuntu/22.04/mssql-server-2022 jammy main" | sudo tee /etc/apt/sources.list.d/mssql-server-2022.list
          echo "deb [arch=amd64,arm64,armhf signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/ubuntu/22.04/prod jammy main" | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update -q
          sudo ACCEPT_EULA=Y apt-get install -y mssql-server mssql-tools18 unixodbc-dev
          echo "/opt/mssql-tools18/bin" >> $GITHUB_PATH

      - name: Configurar e iniciar SQL Server
        env:
          SA_PASS: ${{ secrets.SA_PASS }}
        run: |
          sudo MSSQL_SA_PASSWORD="$SA_PASS" MSSQL_PID=evaluation /opt/mssql/bin/mssql-conf -n setup accept-eula
          sudo systemctl start mssql-server
          echo "SQL Server iniciado"

      - name: Ejecutar script de actualizacion
        env:
          BAK_URL: ${{ secrets.BAK_URL }}
          SA_PASS: ${{ secrets.SA_PASS }}
        run: python update_dashboard.py

      - name: Commit y push
        run: |
          git config user.name "Dashboard Bot"
          git config user.email "bot@autorefricentro.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Auto-update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
