name: Actualizar Dashboard

on:
  # Corre diariamente a las 10pm hora República Dominicana (UTC-4 → 02:00 UTC)
  schedule:
    - cron: '0 2 * * *'

  # Permite ejecutar manualmente desde GitHub → Actions → Run workflow
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-22.04      # versión fija para compatibilidad con SQL Server 2022

    permissions:
      contents: write           # necesario para hacer commit y push

    steps:
      # ── 1. Código del repositorio ─────────────────────────────────────────
      - name: Checkout repositorio
        uses: actions/checkout@v4

      # ── 2. Python ─────────────────────────────────────────────────────────
      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── 3. SQL Server 2022 ────────────────────────────────────────────────
      - name: Instalar SQL Server 2022 y sqlcmd
        run: |
          # Importar clave Microsoft (sin GPG interactivo)
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc \
            | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc > /dev/null
          # Agregar repositorios
          curl -fsSL https://packages.microsoft.com/config/ubuntu/22.04/mssql-server-2022.list \
            | sudo tee /etc/apt/sources.list.d/mssql-server-2022.list
          curl -fsSL https://packages.microsoft.com/config/ubuntu/22.04/prod.list \
            | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update -q
          sudo ACCEPT_EULA=Y apt-get install -y mssql-server mssql-tools18 unixodbc-dev
          echo "/opt/mssql-tools18/bin" >> $GITHUB_PATH

      - name: Configurar e iniciar SQL Server
        env:
          SA_PASS: ${{ secrets.SA_PASS }}
        run: |
          # Configurar SQL Server con contraseña SA y licencia de evaluación (gratuita)
          sudo MSSQL_SA_PASSWORD="$SA_PASS" \
               MSSQL_PID=evaluation \
               /opt/mssql/bin/mssql-conf -n setup accept-eula
          sudo systemctl start mssql-server
          echo "SQL Server iniciado, esperando disponibilidad..."
          # El script Python espera automáticamente hasta que SQL Server esté listo

      # ── 4. Actualizar dashboard ────────────────────────────────────────────
      - name: Ejecutar script de actualización
        env:
          BAK_URL: ${{ secrets.BAK_URL }}
          SA_PASS: ${{ secrets.SA_PASS }}
        run: python update_dashboard.py

      # ── 5. Publicar cambios ────────────────────────────────────────────────
      - name: Commit y push (solo si hubo cambios)
        run: |
          git config user.name  "Dashboard Bot"
          git config user.email "bot@autorefricentro.com"
          git add index.html
          git diff --cached --quiet || \
            git commit -m "Auto-update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
